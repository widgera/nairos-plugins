<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product extraction preview</title>
<style>
:root{
  --bg:#f3f4f1; --panel:#fff; --ink:#20231f; --muted:#646b62; --line:#d9ddd5; --chip:#eef0eb;
  --accent:#c8102e; --code:#f7f8f5; --key:#2f5d8a; --str:#2d6a3e; --num:#9a4b00;
  --flag:#8a6100; --flag-bg:#fff4d6; --bad:#a1192b; --bad-bg:#fde8eb; --ok:#2d6a3e;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Georgian",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161816; --panel:#1f221f; --ink:#e7eae4; --muted:#a2a99f; --line:#343a33; --chip:#2a2e29;
  --accent:#ff4d63; --code:#191b19; --key:#8cb8e6; --str:#8fd19e; --num:#f0b46b;
  --flag:#f3cd6b; --flag-bg:#3a3114; --bad:#ff8a98; --bad-bg:#3d1a1f; --ok:#8fd19e; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);padding:24px 16px 56px}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:18px}
h1{font-size:clamp(20px,2.6vw,28px);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--flag)} .stat.bad b{color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button,.more{font:600 14px var(--ui);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
.bar button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.bar input{font:14px var(--ui);padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:220px;flex:1 1 220px;max-width:360px}
.bar select{font:14px var(--ui);padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);max-width:100%}
.ftable{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.ftable table{min-width:620px}
.ftable th,.ftable td{padding:7px 12px;text-align:left;font-size:13px;border-top:1px solid var(--line);width:auto;color:var(--ink)}
.ftable th{color:var(--muted);font-weight:600;border-top:0}
.ftable td.num{font-variant-numeric:tabular-nums}
.st-ok{color:var(--ok);font-weight:600}.st-bad{color:var(--bad);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;padding:0}
.card:focus-visible,.bar button:focus-visible,.more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .ph{aspect-ratio:4/3;background:var(--chip);display:grid;place-items:center;color:var(--muted);font-size:12px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .tx{padding:10px 12px 12px;display:grid;gap:4px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.card h3{font-size:15px;line-height:1.3;margin:0}
.code{font:12px var(--mono);color:var(--muted)}
.price{font-weight:700}
.price small{font-weight:400;color:var(--muted)}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.flags span{background:var(--flag-bg);color:var(--flag);border-radius:5px;padding:1px 7px;font-size:11.5px}
.more{justify-self:center}
dialog{border:0;border-radius:14px;padding:0;width:min(1240px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0}
.dhead button{font:600 14px var(--ui);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 11px;cursor:pointer}
.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:14px;padding:14px 16px 18px}
@media (max-width:1000px){.panes{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.pane h4{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pane .b{padding:12px 14px;min-width:0}
.pane img.page{width:100%;border:1px solid var(--line);border-radius:4px;background:#fff}
.rowsrc{font:12.5px/1.5 var(--mono);background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word}
pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:70vh;overflow:auto}
.k{color:var(--key)}.s{color:var(--str)}.n{color:var(--num)}
.shop{display:grid;gap:10px}
.shop .big{border-radius:10px;overflow:hidden;background:var(--chip);aspect-ratio:4/5;max-height:460px;display:grid;place-items:center;color:var(--muted);font-size:13px}
.shop .big img{width:100%;height:100%;object-fit:cover}
.shop h3{font-size:19px;margin:0;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--chip);border-radius:6px;padding:4px 8px;font-size:12.5px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
td{border-top:1px solid var(--line);padding:6px 0;vertical-align:top}
td:first-child{color:var(--muted);width:42%;padding-right:10px}
.note{color:var(--muted);font-size:12.5px;margin:8px 0 0}
.rej{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rej li{margin:4px 0}
.rej code{font:12px var(--mono);color:var(--bad)}
footer{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="ftable" id="ftable" hidden></div>
  <div class="bar">
    <button type="button" data-f="all" aria-pressed="true">All</button>
    <button type="button" data-f="flagged" aria-pressed="false">Flagged</button>
    <button type="button" data-f="clean" aria-pressed="false">No flags</button>
    <select id="fileSel" aria-label="Filter by file" hidden></select>
    <input id="q" type="search" placeholder="Search title, code, brand…" aria-label="Search products">
  </div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" type="button" hidden>Show more</button>
  <section class="rej" id="rej" hidden><h2 style="font-size:16px;margin:0 0 6px">Not in the import file</h2><ul id="rejList"></ul></section>
  <footer id="foot"></footer>
</div>

<dialog id="dlg" aria-label="Product details">
  <div class="dhead"><strong id="dTitle"></strong><button type="button" id="dClose">Close</button></div>
  <div class="panes">
    <section class="pane"><h4>In the document</h4><div class="b" id="dSrc"></div></section>
    <section class="pane"><h4>In the import file</h4><div class="b"><pre id="dJson"></pre><p class="note">One line of products.ndjson, formatted for reading.</p></div></section>
    <section class="pane"><h4>As a product card</h4><div class="b"><div class="shop" id="dCard"></div></div></section>
  </div>
</dialog>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FLAG_TEXT = {
  read_from_image:'read from the image', conflict:'files disagree', external_id_generated:'no code in document — id generated',
  title_mostly_not_in_source:'title not found in source text', has_duplicate_id:'another product had the same code',
  price_without_currency:'price had no currency', barcode_check_digit_failed:'barcode check digit fails',
};
const flagLabel = f => {
  if (f.startsWith('conflict:')){ const [k, v] = f.slice(9).split('='); const [a, b] = (v || '').split('|'); return `files disagree on ${k}: ${a} vs ${b}`; }
  return FLAG_TEXT[f] || FLAG_TEXT[f.split(':')[0]] || f.replace(/_/g,' ');
};
let filter = 'all', query = '', fileF = '', shown = 0; const PAGE = 60;

function money(p){ return p ? `${Number(p.amount).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} ${p.currency}` : null; }
function attrs(d){ return d.attributes || []; }
const DULL = /^(collection|decor|brand|category|name)$/i;
function chips(d){ return attrs(d).filter(a => !DULL.test(a.key) && (typeof a.value !== 'string' || a.value.length <= 28)).slice(0,4).map(a => `${a.key}: ${a.value}`); }

function header(){
  const s = D.summary;
  $('title').textContent = s.files.length > 3 ? `Extracted products — ${s.files.length} files` : `Extracted products — ${s.files.join(', ')}`;
  $('subtitle').textContent = `Created ${s.created}. Upload products.ndjson in the Nairos console: space → Products → Catalog → open the product table → Import.`;
  const st = [
    ['ok', s.products, 'products in the import file'],
    [s.expected == null ? '' : (s.expected === s.products ? 'ok' : 'bad'), s.expected ?? '—', 'products the document lists'],
    [s.flagged ? 'warn' : 'ok', s.flagged, 'with flags to check'],
    [s.rejected ? 'bad' : 'ok', s.rejected, 'rejected'],
  ];
  $('stats').innerHTML = st.map(([c,v,l]) => `<div class="stat ${c}"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');
  const rows = D.fileRows || [];
  if (rows.length > 1){
    $('ftable').hidden = false;
    $('ftable').innerHTML = `<table><tr><th>File</th><th>Listed in file</th><th>New products</th><th>Merged into others</th><th>Rejected</th><th>Status</th></tr>` +
      rows.map(r => `<tr><td>${esc(r.file)}</td><td class="num">${r.expected ?? '—'}</td><td class="num">${r.products}</td><td class="num">${r.merged}</td><td class="num">${r.rejected}</td><td class="${r.status==='OK'?'st-ok':(r.status.startsWith('check')?'st-bad':'')}">${esc(r.status)}</td></tr>`).join('') + `</table>`;
    $('fileSel').hidden = false;
    $('fileSel').innerHTML = `<option value="">All files</option>` + rows.map(r => `<option value="${esc(r.file)}">${esc(r.file)}</option>`).join('');
    $('fileSel').onchange = e => { fileF = e.target.value; renderGrid(true); };
  }
  if (D.rejected.length){ $('rej').hidden = false; $('rejList').innerHTML = D.rejected.map(r => `<li><code>${esc(r.where)}</code> ${esc(r.reason)}</li>`).join(''); }
  $('foot').textContent = 'Photos on the cards are cut from the document for this preview and saved in output/images/ by product code. They are not in the import file, because the catalog needs a web address for images.';
}
function list(){
  const q = query.toLowerCase();
  return D.products.filter(p => (filter==='all') || (filter==='flagged' ? p.flags.length : !p.flags.length))
    .filter(p => !fileF || (p.source && p.source.file === fileF) || (p.alsoIn || []).includes(fileF))
    .filter(p => !q || [p.env.data.title, p.env.data.external_id, p.env.data.brand, p.env.data.category].join(' ').toLowerCase().includes(q));
}
function cardHtml(p, i){
  const d = p.env.data, price = money(d.price);
  return `<button class="card" type="button" data-i="${i}">
    <div class="ph">${p.img ? `<img alt="" loading="lazy" src="data:image/jpeg;base64,${p.img}">` : 'no photo'}</div>
    <div class="tx">
      <div class="eyebrow">${esc(d.brand || d.category || '')}</div>
      <h3>${esc(d.title)}</h3>
      <div class="code">${esc(d.external_id)}</div>
      <div class="price">${price ? esc(price) + (d.compare_at_amount ? ` <small><s>${esc(money(d.compare_at_amount))}</s></small>` : '') : '<small>no price in document</small>'}</div>
      ${p.flags.length ? `<div class="flags">${p.flags.slice(0,3).map(f => `<span>${esc(flagLabel(f))}</span>`).join('')}</div>` : ''}
    </div></button>`;
}
function renderGrid(reset){
  const items = list();
  if (reset){ $('grid').innerHTML = ''; shown = 0; }
  const next = items.slice(shown, shown + PAGE);
  $('grid').insertAdjacentHTML('beforeend', next.map(p => cardHtml(p, D.products.indexOf(p))).join(''));
  shown += next.length;
  $('more').hidden = shown >= items.length;
  if (!items.length) $('grid').innerHTML = '<p class="sub">No products match.</p>';
}
function highlight(o){
  const pretty = JSON.stringify(o, null, 2)
    .replace(/\{\n\s+("key": .*?),\n\s+("value": .*?)\n\s+\}/g, '{$1, $2}');
  return esc(pretty)
    .replace(/(^|\{|, )(\s*)(&quot;[^&]*?&quot;)(\s*:)/gm, '$1$2<span class="k">$3</span>$4')
    .replace(/(:\s*)(&quot;.*?&quot;)(?=,|\}|$)/gm, '$1<span class="s">$2</span>')
    .replace(/(:\s*)(-?\d+(?:\.\d+)?|true|false)(?=,|\}|$)/gm, '$1<span class="n">$2</span>');
}
function openDetail(i){
  const p = D.products[i], d = p.env.data, s = p.source || {};
  $('dTitle').textContent = d.title;
  let src = '';
  if (s.page && D.pages[p.pageKey]) src += `<img class="page" alt="page ${esc(s.page)}" src="data:image/jpeg;base64,${D.pages[p.pageKey]}">`;
  if (s.text) src += `<div class="rowsrc">${esc(s.text)}</div>`;
  if ((p.alsoIn || []).length) src += `<p class="note">Also found in: ${esc(p.alsoIn.join(', '))} — merged into this product.</p>`;
  src += `<p class="note">${esc(s.file || '')}${s.page ? `, page ${esc(s.page)}` : ''}${s.sheet ? `, sheet ${esc(s.sheet)}, row ${esc(s.row)}` : ''}${s.method === 'vision' ? ' — read from the page image' : ''}</p>`;
  $('dSrc').innerHTML = src;
  $('dJson').innerHTML = highlight(p.env);
  const price = money(d.price);
  $('dCard').innerHTML = `
    <div class="big">${p.img ? `<img alt="" src="data:image/jpeg;base64,${p.img}">` : 'no photo in document'}</div>
    <div><div class="eyebrow">${esc([d.brand, (d.tags||[])[0]].filter(Boolean).join(' · '))}</div><h3>${esc(d.title)}</h3><div class="code">Code ${esc(d.external_id)}${d.category ? ' · ' + esc(d.category) : ''}</div></div>
    <div class="price">${price ? esc(price) + (d.compare_at_amount ? ` <small><s>${esc(money(d.compare_at_amount))}</s></small>` : '') : '<small>no price in document</small>'}</div>
    ${d.barcode ? `<div class="code">Barcode ${esc(d.barcode)}</div>` : ''}
    <div class="chips">${chips(d).map(c => `<span>${esc(c)}</span>`).join('')}</div>
    ${p.flags.length ? `<div class="flags">${p.flags.map(f => `<span>${esc(flagLabel(f))}</span>`).join('')}</div>` : ''}
    <table>${attrs(d).map(a => `<tr><td>${esc(a.key)}</td><td>${esc(a.value)}</td></tr>`).join('')}</table>`;
  $('dlg').showModal();
}
document.querySelectorAll('.bar button').forEach(b => b.onclick = () => {
  filter = b.dataset.f; document.querySelectorAll('.bar button').forEach(x => x.setAttribute('aria-pressed', x===b)); renderGrid(true); });
$('q').oninput = e => { query = e.target.value; renderGrid(true); };
$('more').onclick = () => renderGrid(false);
$('grid').onclick = e => { const c = e.target.closest('.card'); if (c) openDetail(+c.dataset.i); };
$('dClose').onclick = () => $('dlg').close();
$('dlg').onclick = e => { if (e.target === $('dlg')) $('dlg').close(); };
header(); renderGrid(true);
</script>
</body>
</html>
